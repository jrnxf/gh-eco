name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build
        run: go build -v ./...

      - name: vet
        run: go vet ./...

      - name: fmt
        run: test -z "$(gofmt -l .)"

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: test
        run: go test -v ./...
