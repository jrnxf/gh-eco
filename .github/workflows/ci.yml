name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: go build -v ./...

      - name: vet
        run: go vet ./...

      - name: fmt
        run: test -z "$(gofmt -l .)"

      - name: test
        run: go test -v ./...
